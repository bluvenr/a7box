name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ── Phase 1: Create draft release with auto-generated changelog ──
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for changelog

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          # Find previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            # First release: list all commits
            LOG_RANGE="HEAD"
          else
            LOG_RANGE="${PREV_TAG}..HEAD"
          fi

          # Categorize commits by conventional commit type
          FEAT=""
          FIX=""
          OTHER=""

          while IFS= read -r line; do
            [ -z "$line" ] && continue
            if echo "$line" | grep -qiE '^[a-f0-9]+ feat[:(]'; then
              MSG=$(echo "$line" | sed -E 's/^[a-f0-9]+ //' )
              FEAT="${FEAT}- ${MSG}"$'\n'
            elif echo "$line" | grep -qiE '^[a-f0-9]+ fix[:(]'; then
              MSG=$(echo "$line" | sed -E 's/^[a-f0-9]+ //')
              FIX="${FIX}- ${MSG}"$'\n'
            else
              MSG=$(echo "$line" | sed -E 's/^[a-f0-9]+ //')
              OTHER="${OTHER}- ${MSG}"$'\n'
            fi
          done < <(git log $LOG_RANGE --pretty=format:"%h %s" --no-merges)

          # Build release body
          BODY="## A7Box v${{ steps.get_version.outputs.version }}"$'\n\n'

          if [ -n "$FEAT" ]; then
            BODY="${BODY}### ✨ Features"$'\n'"${FEAT}"$'\n'
          fi
          if [ -n "$FIX" ]; then
            BODY="${BODY}### 🐛 Bug Fixes"$'\n'"${FIX}"$'\n'
          fi
          if [ -n "$OTHER" ]; then
            BODY="${BODY}### 📝 Other Changes"$'\n'"${OTHER}"$'\n'
          fi

          if [ -z "$FEAT" ] && [ -z "$FIX" ] && [ -z "$OTHER" ]; then
            BODY="${BODY}No notable changes in this release."$'\n'
          fi

          # Write to file (avoid shell escaping issues)
          echo "$BODY" > release_body.md

      - name: Create draft release
        id: create_release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('release_body.md', 'utf-8');
            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: `A7Box v${context.ref.replace('refs/tags/v', '')}`,
              body: body,
              draft: true,
              prerelease: false,
            });
            core.setOutput('id', release.data.id);

  # ── Phase 2: Build on all platforms and upload artifacts ──
  build:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'    # Apple Silicon (native)
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'     # Intel (cross-compile on ARM runner)
          - platform: 'ubuntu-22.04'
          - platform: 'windows-latest'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target for macOS cross-compile
        if: matrix.target == 'x86_64-apple-darwin'
        run: rustup target add x86_64-apple-darwin

      - name: Install Apple certificate (macOS)
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Skip if secrets are not configured yet
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "APPLE_CERTIFICATE not set, skipping code signing setup."
            exit 0
          fi
          # Decode and import the certificate
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERTIFICATE_PATH
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Configure macOS signing env
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> $GITHUB_ENV
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # macOS notarization (only effective when signing identity is set)
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
