name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ── Phase 1: Create draft release with auto-generated changelog ──
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for changelog

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          # Find previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            # First release: list all commits
            LOG_RANGE="HEAD"
          else
            LOG_RANGE="${PREV_TAG}..HEAD"
          fi

          # Categorize commits by conventional commit type
          FEAT=""
          FIX=""
          OTHER=""

          while IFS= read -r line; do
            [ -z "$line" ] && continue
            if echo "$line" | grep -qiE '^[a-f0-9]+ feat[:(]'; then
              MSG=$(echo "$line" | sed -E 's/^[a-f0-9]+ //' )
              FEAT="${FEAT}- ${MSG}"$'\n'
            elif echo "$line" | grep -qiE '^[a-f0-9]+ fix[:(]'; then
              MSG=$(echo "$line" | sed -E 's/^[a-f0-9]+ //')
              FIX="${FIX}- ${MSG}"$'\n'
            else
              MSG=$(echo "$line" | sed -E 's/^[a-f0-9]+ //')
              OTHER="${OTHER}- ${MSG}"$'\n'
            fi
          done < <(git log $LOG_RANGE --pretty=format:"%h %s" --no-merges)

          # Build release body
          BODY="## A7Box v${{ steps.get_version.outputs.version }}"$'\n\n'

          if [ -n "$FEAT" ]; then
            BODY="${BODY}### ✨ Features"$'\n'"${FEAT}"$'\n'
          fi
          if [ -n "$FIX" ]; then
            BODY="${BODY}### 🐛 Bug Fixes"$'\n'"${FIX}"$'\n'
          fi
          if [ -n "$OTHER" ]; then
            BODY="${BODY}### 📝 Other Changes"$'\n'"${OTHER}"$'\n'
          fi

          if [ -z "$FEAT" ] && [ -z "$FIX" ] && [ -z "$OTHER" ]; then
            BODY="${BODY}No notable changes in this release."$'\n'
          fi

          # Write to file (avoid shell escaping issues)
          echo "$BODY" > release_body.md

      - name: Create draft release
        id: create_release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('release_body.md', 'utf-8');
            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: `A7Box v${context.ref.replace('refs/tags/v', '')}`,
              body: body,
              draft: true,
              prerelease: false,
            });
            core.setOutput('id', release.data.id);

  # ── Phase 2: Build on all platforms and upload artifacts ──
  build:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'   # Apple Silicon (arm64)
          - platform: 'macos-13'       # Intel (x86_64)
          - platform: 'ubuntu-22.04'   # Linux
          - platform: 'windows-latest' # Windows

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
